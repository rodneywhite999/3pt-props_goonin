# Runs the touchdown watcher on GitHub's servers - no computer of your own needed.
# Every 30 min a job starts; if no NFL game is live or about to kick off it
# exits in seconds, otherwise it polls every 15s until the games are over.
# Add your channel settings under Settings > Secrets and variables > Actions.
name: NFL TD alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification only"
        type: boolean
        default: false

concurrency:
  group: nfl-td-alerts
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore seen-touchdown state
        uses: actions/cache/restore@v4
        with:
          path: nfl-td-alerts/td_state.json
          key: td-state-${{ github.run_id }}
          restore-keys: td-state-
      - name: Watch games
        working-directory: nfl-td-alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TEAMS_FILTER: ${{ vars.TEAMS_FILTER }}
        run: |
          if [ -z "$NTFY_TOPIC$TEAMS_WEBHOOK_URL$TWILIO_ACCOUNT_SID$CALLMEBOT_APIKEY" ]; then
            echo "::warning::No alert channel secret set yet (e.g. NTFY_TOPIC) - skipping. See nfl-td-alerts/README.md"
            exit 0
          fi
          if [ "${{ inputs.test }}" = "true" ]; then
            python td_alerts.py --test
          else
            python td_alerts.py --while-games
          fi
      - name: Save seen-touchdown state
        if: always() && hashFiles('nfl-td-alerts/td_state.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: nfl-td-alerts/td_state.json
          key: td-state-${{ github.run_id }}
